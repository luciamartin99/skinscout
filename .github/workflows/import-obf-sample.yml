name: Import OBF sample

# Manual-only trigger (no push/schedule) — this writes to Supabase, so it
# should only ever run when a human deliberately clicks "Run workflow" in
# the GitHub Actions tab. Needed because Node.js isn't available locally
# yet: GitHub's runners provide Node, and repository secrets keep
# SUPABASE_SERVICE_ROLE_KEY out of chat, logs, and the repo entirely.
on:
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/import-obf-sample.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

